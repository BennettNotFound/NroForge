name: Validate NroForge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: python3 nroforge.py verify-sdk
  hello-nro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.102
      - run: dotnet publish examples/hello/Hello.csproj -c Release -o build/hello-input
      - uses: ./
        id: nro
        with:
          managed-directory: build/hello-input
          profile: examples/hello/nroforge.json
          link-assemblies: 'true'
          output-directory: build/hello-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NroForgeHello
          path: |
            ${{ steps.nro.outputs.nro }}
            ${{ steps.nro.outputs.sd-directory }}
            build/hello-output/BUILD-INFO.json
            build/hello-output/aot-manifest.json
            build/hello-output/logs/
